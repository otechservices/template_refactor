<button
  (click)="toggleTheme()"
  class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors cursor-pointer"
  [title]="themeService.theme() === 'light' ? 'Passer au mode sombre' : 'Passer au mode clair'"
>
  <div class="w-5 h-5 flex items-center justify-center">
    <ng-container *ngIf="themeService.theme() === 'light'; else darkIcon">
      <i class="ri-moon-line text-gray-600 dark:text-gray-300"></i>
    </ng-container>
    <ng-template #darkIcon>
      <i class="ri-sun-line text-yellow-500"></i>
    </ng-template>
  </div>
</button>
