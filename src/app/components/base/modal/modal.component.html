<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center">
  <!-- Overlay -->
  <div
    class="fixed inset-0 bg-black bg-opacity-50 transition-opacity"
    (click)="onClose()"
  ></div>

  <!-- Modal -->
  <div class="relative bg-white dark:bg-gray-800 rounded-xl shadow-2xl w-full mx-4 max-h-[90vh] overflow-y-auto transition-colors"
       [ngClass]="sizeClasses[size]">
    <!-- Header -->
    <div *ngIf="title" class="flex items-center justify-between p-6 border-b border-gray-200 dark:border-gray-700">
      <h3 class="text-xl font-bold text-gray-800 dark:text-white transition-colors">{{ title }}</h3>
      <button
        (click)="onClose()"
        class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 cursor-pointer transition-colors"
      >
        <i class="ri-close-line text-2xl"></i>
      </button>
    </div>

    <!-- Content -->
    <div class="p-6">
      <ng-content></ng-content>
    </div>
  </div>
</div>
