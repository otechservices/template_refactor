<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50" (click)="onClose()">
  <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl p-6 w-full max-w-md" (click)="$event.stopPropagation()">
    <div class="flex justify-between items-center border-b pb-3">
      <h3 class="text-xl font-semibold text-gray-900 dark:text-white">{{ title }}</h3>
      <button (click)="onClose()" class="text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center">
        <i class="ri-close-line text-2xl"></i>
        <span class="sr-only">Close modal</span>
      </button>
    </div>
    <div class="pt-4">
      <ng-content></ng-content>
    </div>
  </div>
</div>
