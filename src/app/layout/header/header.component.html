<header class="fixed top-0 left-0 right-0 bg-white shadow-sm z-50">
  <div class="w-full px-6 py-4">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <img src="https://cape.social.gouv.bj/assets/template2/images/logo-masm.png" alt="LOGO MASM"
          class="h-12 object-contain" />
      </div>

      <nav class="hidden md:flex items-center space-x-8">
        <a routerLink="/" class="text-blue-600 font-medium hover:text-blue-700 cursor-pointer">ACCUEIL</a>

        <!-- Menu Inscriptions avec sous-menu -->
        <div class="relative group">
          <button class="text-gray-700 hover:text-blue-600 cursor-pointer flex items-center">
            INSCRIPTIONS
            <i class="ri-arrow-down-s-line ml-1"></i>
          </button>
          <div
            class="absolute top-full left-0 mt-2 w-56 bg-white shadow-lg rounded-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50">
            <div class="py-2">
              <a routerLink="/inscription-cape"
                class="block px-4 py-2 text-gray-700 hover:bg-blue-50 hover:text-blue-600">
                Inscription CAPE
              </a>
              <a routerLink="/inscription-garderie"
                class="block px-4 py-2 text-gray-700 hover:bg-blue-50 hover:text-blue-600">
                Inscription Garderie
              </a>
            </div>
          </div>
        </div>

        <!-- Menu Délibérations avec sous-menu -->
        <div class="relative group">
          <button class="text-gray-700 hover:text-blue-600 cursor-pointer flex items-center">
            DÉLIBÉRATIONS
            <i class="ri-arrow-down-s-line ml-1"></i>
          </button>
          <div
            class="absolute top-full left-0 mt-2 w-56 bg-white shadow-lg rounded-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50">
            <div class="py-2">
              <a routerLink="/deliberations-cape"
                class="block px-4 py-2 text-gray-700 hover:bg-blue-50 hover:text-blue-600">
                Délibérations CAPE
              </a>
              <a routerLink="/deliberations-garderie"
                class="block px-4 py-2 text-gray-700 hover:bg-blue-50 hover:text-blue-600">
                Délibérations Garderie
              </a>
            </div>
          </div>
        </div>

        <!-- Menu Structures Autorisées avec sous-menu -->
        <div class="relative group">
          <button class="text-gray-700 hover:text-blue-600 cursor-pointer flex items-center">
            STRUCTURES AUTORISÉES
            <i class="ri-arrow-down-s-line ml-1"></i>
          </button>
          <div
            class="absolute top-full left-0 mt-2 w-64 bg-white shadow-lg rounded-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 z-50">
            <div class="py-2">
              <a routerLink="/cape-autorises"
                class="block px-4 py-2 text-gray-700 hover:bg-blue-50 hover:text-blue-600">
                CAPE Autorisés
              </a>
              <a routerLink="/garderies-autorisees"
                class="block px-4 py-2 text-gray-700 hover:bg-blue-50 hover:text-blue-600">
                Garderies Autorisées
              </a>
            </div>
          </div>
        </div>

        <a routerLink="/actualites" class="text-gray-700 hover:text-blue-600 cursor-pointer">ACTUALITÉS</a>
        <a routerLink="/contact" class="text-gray-700 hover:text-blue-600 cursor-pointer">CONTACT</a>
      </nav>

      <div class="flex items-center space-x-4">
        <ng-container *ngIf="isLoggedIn$ | async; else loggedOut">
          <a routerLink="/dashboard"
            class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition-colors duration-200 cursor-pointer whitespace-nowrap">
            Mon Espace
          </a>
        </ng-container>
        <ng-template #loggedOut>
          <a routerLink="/auth/login" class="text-blue-600 hover:text-blue-700 font-medium cursor-pointer whitespace-nowrap">
            Se connecter
          </a>
          <a routerLink="/auth/register"
            class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition-colors duration-200 cursor-pointer whitespace-nowrap">
            S'inscrire
          </a>
        </ng-template>
      </div>

      <!-- Menu mobile -->
      <button class="md:hidden text-gray-600 hover:text-gray-900">
        <i class="ri-menu-line text-2xl"></i>
      </button>
    </div>
  </div>
</header>
