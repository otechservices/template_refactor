<aside class="fixed left-0 top-20 w-64 h-[calc(100vh-5rem)] bg-white shadow-lg border-r border-gray-200 overflow-y-auto">
  <div class="p-6">
    <h2 class="text-lg font-semibold text-gray-900 mb-6">Tableau de bord</h2>

    <nav class="space-y-2">
      <button
        *ngFor="let item of menuItems"
        (click)="changeSection(item.id)"
        class="w-full flex items-center px-4 py-3 text-left rounded-lg transition-colors"
        [ngClass]="{
          'bg-blue-50 text-blue-700 border-r-2 border-blue-700': activeSection === item.id,
          'text-gray-700 hover:bg-gray-50 hover:text-gray-900': activeSection !== item.id
        }"
      >
        <i class="{{item.icon}} text-xl mr-3 w-6 h-6 flex items-center justify-center"></i>
        <span class="font-medium">{{item.label}}</span>
      </button>
    </nav>
  </div>
</aside>
