<section class="py-16 bg-gray-50">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center mb-12">
      <div>
        <h2 class="text-4xl font-bold text-gray-900 mb-2">
          Actualités du Maire
        </h2>
        <div class="w-20 h-1 bg-blue-600"></div>
      </div>
      <a
        routerLink="/actualites"
        class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium transition-colors duration-200 whitespace-nowrap cursor-pointer"
      >
        Voir toutes les actualités →
      </a>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <a
        *ngFor="let article of news"
        routerLink="/actualites"
        class="bg-white rounded-xl shadow-lg overflow-hidden hover:shadow-xl transition-all duration-300 cursor-pointer group block"
      >
        <div class="relative overflow-hidden">
          <img
            [src]="article.image"
            [alt]="article.title"
            class="w-full h-48 object-cover group-hover:scale-105 transition-transform duration-300"
          />
          <div class="absolute top-4 left-4">
            <span class="bg-blue-600 text-white px-3 py-1 rounded-full text-sm font-medium">
              {{ article.category }}
            </span>
          </div>
        </div>
        <div class="p-6">
          <div class="flex items-center text-gray-500 text-sm mb-3">
            <i class="ri-calendar-line mr-2"></i>
            {{ article.date }}
          </div>
          <h3 class="text-xl font-bold text-gray-900 mb-3 group-hover:text-blue-600 transition-colors">
            {{ article.title }}
          </h3>
          <p class="text-gray-600 leading-relaxed">
            {{ article.excerpt }}
          </p>
          <div class="mt-4 flex items-center text-blue-600 font-medium">
            <span class="mr-2">Lire la suite</span>
            <i class="ri-arrow-right-line group-hover:translate-x-1 transition-transform"></i>
          </div>
        </div>
      </a>
    </div>
  </div>
</section>
