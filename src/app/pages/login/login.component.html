<div class="min-h-screen bg-gray-50">
  <app-header></app-header>

  <div
    class="min-h-screen flex items-center justify-center py-20 bg-cover bg-center"
    [ngStyle]="{
      'background-image': 'url(https://readdy.ai/api/search-image?query=Professional%20African%20business%20person%20working%20on%20laptop%20in%20modern%20bright%20office%20environment%2C%20government%20building%20in%20background%2C%20clean%20minimalist%20workspace%2C%20warm%20natural%20lighting%2C%20welcoming%20atmosphere%20for%20user%20authentication%20and%20login&width=1920&height=1080&seq=login-bg&orientation=landscape)'
    }"
  >
    <div class="absolute inset-0 bg-white/80"></div>

    <div class="relative z-10 w-full max-w-md px-6">
      <div class="bg-white rounded-2xl shadow-2xl p-8">
        <div class="text-center mb-8">
          <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="ri-user-line text-2xl text-blue-600"></i>
          </div>
          <h1 class="text-2xl font-bold text-gray-900 mb-2">Connexion</h1>
          <p class="text-gray-600">Accédez à votre espace personnel</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
              Adresse email*
            </label>
            <input
              type="email"
              id="email"
              formControlName="email"
              required
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
              placeholder="votre.email@exemple.com"
            />
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
              Mot de passe*
            </label>
            <input
              type="password"
              id="password"
              formControlName="password"
              required
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
              placeholder="Votre mot de passe"
            />
          </div>

          @if (submitStatus === 'success') {
            <div class="bg-green-50 border border-green-200 rounded-lg p-4">
              <div class="flex items-center">
                <i class="ri-check-circle-line text-green-600 text-xl mr-3"></i>
                <p class="text-green-800">
                  Connexion réussie ! Redirection vers votre dashboard...
                </p>
              </div>
            </div>
          }

          @if (submitStatus === 'error') {
            <div class="bg-red-50 border border-red-200 rounded-lg p-4">
              <div class="flex items-center">
                <i class="ri-error-warning-line text-red-600 text-xl mr-3"></i>
                <p class="text-red-800">
                  Email ou mot de passe incorrect. Veuillez réessayer.
                </p>
              </div>
            </div>
          }

          <button
            type="submit"
            [disabled]="isSubmitting || loginForm.invalid"
            class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed text-white py-3 rounded-lg font-medium transition-colors duration-200 flex items-center justify-center space-x-2 whitespace-nowrap"
          >
            @if (isSubmitting) {
              <ng-container>
                <i class="ri-loader-4-line animate-spin text-xl"></i>
                <span>Connexion...</span>
              </ng-container>
            } @else {
              <ng-container>
                <span>Se connecter</span>
                <i class="ri-arrow-right-line text-xl"></i>
              </ng-container>
            }
          </button>
        </form>

        <div class="mt-6 text-center">
          <p class="text-gray-600">
            Pas encore de compte ?
            <a routerLink="/register" class="text-blue-600 hover:text-blue-700 font-medium">
              Créer un compte
            </a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
